<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wirkstatt · Liebenberg</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>/* Layout: Seitenleiste + Arbeitsfläche (Desktop) · Kopfzeile + Inhalt + untere Leiste (Smartphone / Handy-Rahmen) */
:root{
  --brand:#6B7A3E;
  --brand-dark:color-mix(in srgb,var(--brand) 78%,#000);
  --brand-ink:color-mix(in srgb,var(--brand) 62%,#1E2318);
  --brand-tint:color-mix(in srgb,var(--brand) 15%,#fff);
  --nav-bg:var(--brand);
  --bg:#F3F4EF; --surface:#FFFFFF; --surface-2:#F7F8F4; --line:#DCDFD3; --line-2:#ECEEE6;
  --fg:#1E2318; --muted:#5B6152; --faint:#7A8070;
  --warn:#A04050; --warn-ink:#8A3443; --warn-tint:#F6E6E9; --warn-line:#E4C3CA;
  --info:#1E3560; --info-ink:#1E3560; --info-tint:#E3E8F2;
  --ok:#3F7A3A; --ok-ink:#2F5F2B; --ok-tint:#E4F0E2;
  --gold-ink:#5C4415; --gold-tint:#FBF5E8; --gold-line:#E8D7AF;
  --lila-ink:#5E4673; --lila-tint:#EFE9F3;
  --sea-1:#9CC3DA; --sea-2:#4E86A8; --sand:#E9D9B4;
  --stage:#23271E; --scrim:rgba(20,24,15,.48);
  --shadow:0 1px 2px rgba(30,35,24,.06),0 6px 20px rgba(30,35,24,.07);
  --shadow-lg:0 12px 40px rgba(20,24,15,.22);
  --font:'Source Sans 3','Segoe UI',system-ui,Arial,sans-serif;
  --fs:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --brand-ink:color-mix(in srgb,var(--brand) 45%,#EEF2E4);
  --brand-tint:color-mix(in srgb,var(--brand) 26%,#1E2219);
  --nav-bg:color-mix(in srgb,var(--brand) 62%,#0E100A);
  --bg:#14170F; --surface:#1E2219; --surface-2:#252A1F; --line:#383E2E; --line-2:#2D3226;
  --fg:#E9ECE2; --muted:#AAB19E; --faint:#8E9583;
  --warn-ink:#F2AEBB; --warn-tint:#3A2027; --warn-line:#5A2D37;
  --info-ink:#B6C7EC; --info-tint:#1E2840;
  --ok-ink:#A8D6A2; --ok-tint:#1E3320;
  --gold-ink:#EBD29A; --gold-tint:#33291A; --gold-line:#55452A;
  --lila-ink:#D7C3E6; --lila-tint:#2E2537;
  --stage:#0B0D08; --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --brand-ink:color-mix(in srgb,var(--brand) 45%,#EEF2E4);
  --brand-tint:color-mix(in srgb,var(--brand) 26%,#1E2219);
  --nav-bg:color-mix(in srgb,var(--brand) 62%,#0E100A);
  --bg:#14170F; --surface:#1E2219; --surface-2:#252A1F; --line:#383E2E; --line-2:#2D3226;
  --fg:#E9ECE2; --muted:#AAB19E; --faint:#8E9583;
  --warn-ink:#F2AEBB; --warn-tint:#3A2027; --warn-line:#5A2D37;
  --info-ink:#B6C7EC; --info-tint:#1E2840;
  --ok-ink:#A8D6A2; --ok-tint:#1E3320;
  --gold-ink:#EBD29A; --gold-tint:#33291A; --gold-line:#55452A;
  --lila-ink:#D7C3E6; --lila-tint:#2E2537;
  --stage:#0B0D08; --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);
  color-scheme:dark;
}
html{font-size:var(--fs)}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:1rem;line-height:1.45;margin:0;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
a{color:var(--brand-ink)}
:focus-visible{outline:3px solid var(--info);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.i{flex:none;display:inline-block;vertical-align:middle}
.tab{font-variant-numeric:tabular-nums}

/* ---------- Stage / App ---------- */
.stage{min-height:100vh}
.stage.on{display:flex;justify-content:center;align-items:flex-start;padding:28px 16px 90px;background:var(--stage)}
.app{position:relative;display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh;background:var(--bg)}
.app.m{display:flex;flex-direction:column}
.app.phone{width:390px;max-width:100%;height:844px;min-height:0;border-radius:40px;border:11px solid #0E0F0C;overflow:hidden;box-shadow:var(--shadow-lg)}
.mainwrap{min-width:0;display:flex;flex-direction:column}
.app.m .mainwrap{flex:1}
.app.phone .mainwrap{overflow:auto;min-height:0}
.view{padding:1.6rem 2rem 3rem;width:100%;max-width:1240px;display:flex;flex-direction:column;gap:1.4rem}
.app.m .view{padding:1rem 1rem 2rem;gap:1rem}

/* ---------- Seitenleiste ---------- */
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--nav-bg);color:#fff;display:flex;flex-direction:column;padding-bottom:1.2rem}
.side .brandbox{padding:30px 30px 22px}
.logo-svg{display:block;width:118px;height:auto;color:#fff}
.logo-ph{width:118px;height:84px;border:2px dashed rgba(255,255,255,.8);border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:.8rem;line-height:1.2;color:#fff}
.nav{display:flex;flex-direction:column;gap:2px;padding:0 12px}
.nav button{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 14px;border:0;border-radius:9px;background:transparent;color:#fff;cursor:pointer;text-align:left;width:100%}
.nav button:hover{background:rgba(255,255,255,.1)}
.nav button[aria-current="page"]{background:rgba(255,255,255,.2);font-weight:700}
.nav .lbl{flex:1}
.nbadge{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#fff;color:var(--brand-dark);font-size:.8rem;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.side .foot{margin-top:auto;padding:1.2rem 26px 0;font-size:.8rem;opacity:.92}

/* ---------- Kopfzeilen ---------- */
.dhead{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 2rem;background:var(--surface);border-bottom:1px solid var(--line)}
.search{flex:1 1 360px;display:flex;align-items:center;gap:10px;min-height:46px;padding:0 6px 0 14px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2)}
.search input{flex:1;border:0;background:transparent;min-width:0;outline:none}
.search:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-tint)}
.mhead{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;background:var(--nav-bg);color:#fff;padding:8px 8px 8px 14px}
.mhead .logo-svg{width:48px}
.mhead .logo-ph{width:56px;height:40px;font-size:.6rem}
.mhead .ttl{flex:1;font-weight:700;font-size:1.05rem;padding-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:44px;height:44px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--fg);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;position:relative;flex:none}
.ibtn:hover{background:var(--surface-2)}
.mhead .ibtn{border:0;background:transparent;color:#fff}
.mhead .ibtn:hover{background:rgba(255,255,255,.12)}
.dot{position:absolute;top:8px;right:8px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--warn);color:#fff;font-size:.7rem;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--surface)}
.mhead .dot{border-color:var(--nav-bg)}
.av{width:44px;height:44px;border-radius:50%;background:var(--brand-tint);color:var(--brand-ink);font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none;border:0;cursor:pointer;font-size:.95rem}
.av.s{width:36px;height:36px;font-size:.8rem;cursor:default}
.av.xs{width:30px;height:30px;font-size:.72rem;cursor:default}
.av.c1{background:var(--info-tint);color:var(--info-ink)} .av.c2{background:var(--lila-tint);color:var(--lila-ink)} .av.c3{background:var(--warn-tint);color:var(--warn-ink)} .av.c4{background:var(--gold-tint);color:var(--gold-ink)}

/* ---------- Untere Leiste (Smartphone) ---------- */
.bnav{position:sticky;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(10px + env(safe-area-inset-bottom,0px))}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;justify-content:center;border:0;background:transparent;color:var(--muted);font-size:.72rem;cursor:pointer;position:relative}
.bnav .pill{display:inline-flex;padding:3px 14px;border-radius:999px}
.bnav button[aria-current="page"]{color:var(--brand-ink);font-weight:700}
.bnav button[aria-current="page"] .pill{background:var(--brand-tint)}
.bnav .nbadge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--warn);color:#fff;min-width:18px;height:18px;font-size:.68rem}

/* ---------- Bausteine ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.2rem 1.35rem}
.card.flat{box-shadow:none}
.card h2{font-size:1.15rem}
.chead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:.4rem}
.lnk{border:0;background:none;color:var(--brand-ink);font-weight:600;cursor:pointer;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.btn{min-height:44px;padding:0 16px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-dark)}
.btn.warn{background:var(--warn);border-color:var(--warn);color:#fff}
.btn.sm{min-height:36px;padding:0 12px;font-size:.92rem;border-radius:9px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.on{background:var(--brand-tint);border-color:var(--brand);color:var(--brand-ink)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--line-2);color:var(--muted);white-space:nowrap}
.chip.b{background:var(--brand-tint);color:var(--brand-ink)}
.chip.w{background:var(--warn-tint);color:var(--warn-ink)}
.chip.i{background:var(--info-tint);color:var(--info-ink)}
.chip.l{background:var(--lila-tint);color:var(--lila-ink)}
.chip.g{background:var(--gold-tint);color:var(--gold-ink)}
.chip.o{background:var(--ok-tint);color:var(--ok-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.fchip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:.86rem} .xs{font-size:.78rem}
.row{display:flex;align-items:center;gap:12px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.cols{display:flex;flex-wrap:wrap;gap:1.4rem;align-items:flex-start}
.col-main{flex:2 1 540px;min-width:0;display:flex;flex-direction:column;gap:1.4rem}
.col-side{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:1.4rem}
.app.m .cols,.app.m .col-main,.app.m .col-side{gap:1rem}
.li{display:flex;gap:12px;padding:.8rem 0;border-top:1px solid var(--line-2);align-items:flex-start}
.li:first-of-type{border-top:0}
.libtn{width:100%;text-align:left;background:none;border:0;cursor:pointer;color:inherit;padding:.8rem 0;border-top:1px solid var(--line-2);display:flex;gap:12px;align-items:flex-start}
.libtn:hover .t{text-decoration:underline}
.udot{width:10px;height:10px;border-radius:50%;background:var(--brand);margin-top:7px;flex:none}
.udot.r{background:transparent;border:2px solid var(--line)}
.t{font-weight:700}
.bar{height:8px;border-radius:4px;background:var(--line-2);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--brand);border-radius:4px;transition:width .4s}
.input,.select,textarea.input{width:100%;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
textarea.input{padding:10px 12px;resize:vertical;min-height:90px}
.input:focus,.select:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-tint)}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.flabel{font-weight:600;font-size:.95rem}
.check{display:flex;align-items:flex-start;gap:10px;cursor:pointer;min-height:40px;padding:6px 0}
.check input{width:22px;height:22px;accent-color:var(--brand);margin:1px 0 0;flex:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;flex-wrap:wrap}
.seg button{min-height:40px;padding:0 14px;border:0;background:var(--surface);cursor:pointer;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff;font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{min-height:44px;padding:0 14px;border:0;border-bottom:3px solid transparent;background:transparent;cursor:pointer;color:var(--muted)}
.tabs button[aria-selected="true"]{border-bottom-color:var(--brand);color:var(--fg);font-weight:700}
.note{display:flex;gap:10px;padding:12px 14px;border-radius:11px;background:var(--info-tint);color:var(--info-ink);font-size:.9rem}
.note.g{background:var(--gold-tint);color:var(--gold-ink)}
.note.b{background:var(--brand-tint);color:var(--brand-ink)}
.empty{padding:2rem 1rem;text-align:center;color:var(--muted)}
.photo{border-radius:12px;overflow:hidden;background:var(--line-2);display:block;width:100%}
.photo svg,.photo img{display:block;width:100%;height:100%;object-fit:cover}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem}
.app.m .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1rem 1.2rem}
.kpi .v{font-size:2.1rem;font-weight:700;line-height:1.15}
.app.m .kpi .v{font-size:1.6rem}
.kpi .s{font-size:.78rem;color:var(--muted)}
.src{font-size:.78rem;color:var(--muted);padding-top:.4rem;display:flex;gap:6px;align-items:center}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:16px 18px;border-radius:14px;background:var(--warn-tint);border:1px solid var(--warn-line)}
.banner .ico{width:42px;height:42px;border-radius:11px;background:var(--warn);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.hello h1{font-size:2rem;font-weight:700}
.app.m .hello h1{font-size:1.6rem}
.ptitle{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.ptitle h1{font-size:1.9rem}
.app.m .ptitle h1{font-size:1.5rem}
.prose{font-size:1.05rem;line-height:1.6;max-width:68ch}
.prose p{margin:0 0 .8rem}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1rem;max-width:72ch}
.steps li{display:flex;gap:14px}
.num{width:32px;height:32px;border-radius:50%;background:var(--brand);color:#fff;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}
.mention{background:var(--brand-tint);color:var(--brand-ink);font-weight:700;padding:0 4px;border-radius:4px}
.cmt{flex:1;background:var(--surface-2);border-radius:11px;padding:.6rem .85rem;min-width:0}
.donut{width:112px;height:112px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.donut>div{width:80px;height:80px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center}
.tbl{width:100%;border-collapse:collapse;font-size:.95rem}
.tbl th,.tbl td{padding:.75rem .8rem;text-align:left;border-top:1px solid var(--line-2);vertical-align:top}
.tbl thead th{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:0}
.scrollx{overflow-x:auto}
.kb{display:grid;grid-template-columns:repeat(3,minmax(240px,1fr));gap:1rem}
.app.m .kb{grid-template-columns:1fr}
.kcol{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:1rem;display:flex;flex-direction:column;gap:.75rem}
.icard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.9rem 1rem;display:flex;flex-direction:column;gap:.5rem}
.vote{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
.vote.on{background:var(--brand-tint);border-color:var(--brand);color:var(--brand-ink)}

/* Chat */
.chatwrap{display:grid;grid-template-columns:300px minmax(0,1fr);border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);min-height:560px}
.app.m .chatwrap{grid-template-columns:minmax(0,1fr);border-radius:14px;min-height:0}
.clist{border-right:1px solid var(--line);display:flex;flex-direction:column}
.clist button{min-width:0;width:100%;display:flex;gap:10px;align-items:center;text-align:left;padding:.85rem 1rem;border:0;border-bottom:1px solid var(--line-2);background:transparent;cursor:pointer;color:inherit}
.clist button[aria-current="true"]{background:var(--brand-tint)}
.thread{display:flex;flex-direction:column;min-height:520px;background:var(--surface-2)}
.app.m .thread{min-height:60vh}
.app.phone .thread{min-height:560px}
.thead{display:flex;align-items:center;gap:10px;padding:.8rem 1rem;border-bottom:1px solid var(--line);background:var(--surface)}
.msgs{flex:1;padding:1rem;display:flex;flex-direction:column;gap:.7rem;overflow:auto}
.msg{max-width:78%;padding:.55rem .85rem;border-radius:4px 14px 14px 14px;background:var(--surface);border:1px solid var(--line)}
.msg.me{align-self:flex-end;background:var(--brand);border-color:var(--brand);color:#fff;border-radius:14px 4px 14px 14px}
.msg .who{font-size:.8rem;font-weight:700;color:var(--info-ink)}
.msg .meta{font-size:.72rem;opacity:.85;display:flex;gap:8px;justify-content:space-between;margin-top:2px}
.msg.me .meta{justify-content:flex-end}
.ticks{font-weight:700;letter-spacing:-.15em}
.typing{align-self:flex-start;font-size:.85rem;color:var(--muted);font-style:italic}
.composer{display:flex;gap:8px;padding:.7rem;border-top:1px solid var(--line);background:var(--surface);align-items:center}
.composer input{flex:1;min-height:44px;border:1px solid var(--line);border-radius:22px;padding:0 14px;background:var(--surface);min-width:0}
.rbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--brand);color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}

/* Wissen */
.tree button{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:40px;padding:0 10px;border:0;border-radius:8px;background:transparent;cursor:pointer;text-align:left;color:inherit}
.tree button:hover{background:var(--surface-2)}
.tree button[aria-current="page"]{background:var(--brand-tint);color:var(--brand-ink);font-weight:700}
.tree .sub{margin-left:12px;padding-left:10px;border-left:2px solid var(--line-2)}
.diff del{background:var(--warn-tint);color:var(--warn-ink)}
.diff ins{background:var(--ok-tint);color:var(--ok-ink);text-decoration:none}
.media{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:12px;overflow:hidden;background:var(--line-2)}
.media .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.media .play span{width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center}
.media .cc{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.65);color:#fff;font-size:.72rem;font-weight:700;padding:2px 6px;border-radius:4px}

/* KI */
.ai{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:1.3rem 1.4rem}
.ai .badge{width:38px;height:38px;border-radius:11px;background:var(--info);color:#fff;display:flex;align-items:center;justify-content:center}
.thinking span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:4px;animation:blink 1.2s infinite}
.thinking span:nth-child(2){animation-delay:.2s}.thinking span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.fade{animation:fade .45s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.srcbtn{display:flex;gap:10px;align-items:center;padding:.6rem .8rem;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left;color:inherit;width:100%}
.srcbtn:hover{border-color:var(--brand)}
mark{background:var(--gold-tint);color:inherit;padding:0 2px;border-radius:3px}

/* Checkliste */
.citem{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:.85rem 1rem}
.citem.bad{border:2px solid var(--warn)}
.citem.cur{border:2px solid var(--brand)}
.cstate{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;font-weight:700;font-size:.85rem;border:2px solid var(--line);color:var(--muted)}
.cstate.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.cstate.bad{background:var(--warn);border-color:var(--warn);color:#fff}
.tinput{display:flex;gap:8px;margin-top:.6rem}
.tinput input{flex:1;min-width:0;min-height:50px;font-size:1.3rem;font-weight:700;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}

/* Overlay, Toasts */
.overlay{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:16px}
.app.phone .overlay{position:absolute}
.sheet{background:var(--surface);color:var(--fg);border-radius:18px;box-shadow:var(--shadow-lg);width:min(560px,100%);max-height:calc(100% - 24px);overflow:auto;padding:1.4rem 1.5rem;display:flex;flex-direction:column;gap:1rem}
.app.m .sheet{align-self:flex-end;border-radius:18px 18px 0 0;width:100%;max-height:88%}
.app.m .overlay{padding:0;align-items:flex-end}
.sheet .shead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sheet h2{font-size:1.3rem}
.endart{display:flex;justify-content:center;color:var(--brand);padding:.4rem 0}
.endart .logo-svg{width:110px;color:var(--brand)}
.toasts{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
.app.phone .toasts{position:absolute;bottom:90px}
.app.m:not(.phone) .toasts{bottom:156px}
.toast{background:#1E2318;color:#fff;padding:.7rem 1.1rem;border-radius:12px;box-shadow:var(--shadow-lg);font-weight:600;display:flex;gap:10px;align-items:center;animation:fade .3s both}
.pop{position:absolute;z-index:40;top:calc(100% + 8px);right:0;width:360px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);padding:.6rem;color:var(--fg)}
.popwrap{position:relative}
.pop .pi{display:flex;gap:10px;width:100%;text-align:left;padding:.7rem;border:0;background:transparent;border-radius:10px;cursor:pointer;color:inherit}
.pop .pi:hover{background:var(--surface-2)}
.app.m .pop{position:fixed;top:64px;right:8px}
.app.phone .pop{position:absolute;top:60px}

/* Demo-Leiste */
.demofab{position:fixed;right:18px;bottom:18px;z-index:90;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.app-m-body .demofab{bottom:96px}
.demobtn{min-height:46px;padding:0 18px;border-radius:999px;border:0;background:#1E2318;color:#fff;font-weight:700;display:inline-flex;align-items:center;gap:8px;cursor:pointer;box-shadow:var(--shadow-lg)}
.demopanel{width:340px;max-width:calc(100vw - 36px);max-height:70vh;overflow:auto;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);padding:1rem 1.1rem;display:flex;flex-direction:column;gap:.8rem}
.demopanel ol{margin:0;padding-left:1.2rem;display:flex;flex-direction:column;gap:.35rem}
.demopanel ol button{border:0;background:none;color:var(--brand-ink);text-align:left;padding:2px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* Login */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);background:var(--bg)}
.login .hero{background:var(--nav-bg);color:#fff;padding:3rem;display:flex;flex-direction:column;justify-content:space-between;gap:2rem;position:relative;overflow:hidden}
.login .hero .logo-svg{width:150px}
.login .hero h1{font-size:2.6rem;font-weight:700;max-width:14ch;line-height:1.1}
.login .hero p{font-size:1.15rem;max-width:40ch;opacity:.95;margin:.6rem 0 0}
.login .pane{padding:3rem 2.5rem;display:flex;flex-direction:column;justify-content:center;gap:1.2rem;max-width:620px;width:100%}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem}
.pcard{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:1rem;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;color:inherit}
.pcard:hover{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-tint)}
.pcard[aria-pressed="true"]{border:2px solid var(--brand)}
.lines{position:absolute;right:-60px;bottom:-40px;width:420px;opacity:.12;color:#fff}
@media (max-width:820px){
  .login{grid-template-columns:1fr}
  .login .hero{padding:2rem 1.25rem}
  .login .hero h1{font-size:2rem}
  .login .pane{padding:1.5rem 1rem 6rem}
  .pgrid{grid-template-columns:1fr}
}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:95;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.confetti{display:none}}

.side .wm{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.28);text-align:center}
.side .wm span{font-weight:700;font-size:1.15rem;letter-spacing:.32em;text-transform:uppercase;padding-left:.32em}
.mhead .wm-m{font-weight:700;letter-spacing:.22em;text-transform:uppercase;font-size:.95rem}
.login .hero .wm-hero{font-weight:700;font-size:1rem;letter-spacing:.4em;text-transform:uppercase;opacity:.9;margin-bottom:.9rem}
</style>

  const u = me(); if(!u) return 0;

  if(r==='chat') return S.chats.reduce((a,c)=>a+(c.unread||0),0);

function snapshot(){
  const a = document.activeElement; const vals={};
  root.querySelectorAll('input[id],textarea[id],select[id]').forEach(el=>{ if(el.type!=='file') vals[el.id] = el.type==='checkbox'?el.checked:el.value; });
  return { id:a&&a.id, s:a&&a.selectionStart, vals };
}
function restore(sn){
  Object.entries(sn.vals).forEach(([id,v])=>{ const el=document.getElementById(id); if(el && el.dataset.keep!=='no'){ if(el.type==='checkbox') el.checked=v; else if(el.value!==v && !el.dataset.fresh) el.value=v; }});
  if(sn.id){ const el=document.getElementById(sn.id); if(el){ el.focus({preventScroll:true}); try{ if(sn.s!=null) el.setSelectionRange(sn.s,sn.s);}catch(e){} } }
}
function scroller(){ return S.phone ? root.querySelector('.mainwrap') : document.scrollingElement; }
function render(resetScroll){
  const sn = snapshot(); const sc = scroller(); const top = sc ? sc.scrollTop : 0;
  root.innerHTML = S.user ? shell() : login();
  restore(sn);
  const sc2 = scroller(); if(sc2) sc2.scrollTop = resetScroll ? 0 : top;
  document.body.classList.toggle('app-m-body', !!S.user && isM() && !S.phone);
  const th = root.querySelector('.msgs'); if(th) th.scrollTop = th.scrollHeight;
}
function go(route, param=null){ S.route=route; S.param=param; S.pop=null; S.modal=null; S.customize=false; if(route!=='suche') S.ai=S.ai; render(true); }

function audit(what){ S.audit.unshift({t:'heute '+nowT(), who:me()?me().name:'System', what}); }
function notify(uidv, text, route, param){ (S.notifs[uidv] ||= []).unshift({id:uid(), text, time:nowT(), route, param, read:false}); }
function endDemo(key){ S.modal={type:'end', key}; render(); }

  const pct = total? Math.round(n/total*100):0;
  return `<div class="donut" role="img" aria-label="${n} von ${total} ${label}" style="background:conic-gradient(var(--brand) 0 ${pct}%, var(--line) ${pct}% 100%)"><div><span style="font-size:1.6rem;font-weight:700;line-height:1">${n}</span><span class="xs muted">von ${total}</span></div></div>`;
}

  const T = lang==='de' ? {title:n.title, body:n.body} : (n[lang] || {title:n.title, body:n.body, missing:true});
  const showRead = n.track && (n.author===u.id || can('readlist'));
  return `<button class="lnk" data-a="go" data-r="news" style="align-self:flex-start">${ic('back',16)} Alle News</button>
  <div class="cols"><article class="card col-main" style="padding:1.6rem 1.8rem;gap:.9rem">
    <div class="chips">${n.important?'<span class="chip w">Wichtig</span>':''}${n.aud.map(a=>`<span class="chip">an: ${a}</span>`).join('')}</div>
    <h1 style="font-size:1.8rem">${esc(T.title)}</h1>
    <div class="row">${av(n.author)}<span class="small muted"><strong style="color:var(--fg)">${P(n.author).name}</strong> · ${P(n.author).job||''} · ${n.time}</span></div>
    <div class="row wrap"><div class="seg" role="group" aria-label="Sprache">${[['de','Original (Deutsch)'],['en','English'],['pl','Polski']].map(([k,l])=>`<button aria-pressed="${lang===k}" data-a="newslang" data-id="${n.id}" data-l="${k}">${l}</button>`).join('')}</div>

    ${T.missing?`<div class="note g">${ic('globe',18)}<span>Maschinelle Übersetzung ist in der Demo nur für einige Beispielbeiträge hinterlegt. In der Wirkstatt übersetzt ein EU-Dienst auf Knopfdruck – das Original bleibt immer erreichbar.</span></div>`: lang!=='de'?`<div class="xs muted">Maschinell übersetzt · <button class="lnk xs" data-a="newslang" data-id="${n.id}" data-l="de">Original anzeigen</button></div>`:''}
    ${n.photo? photo(n.photo, 260):''}
    <div class="prose" id="newsbody">${T.body.map(p=>`<p>${mentionfy(p)}</p>`).join('')}</div>

    ${n.attach?`<button class="srcbtn" data-a="end" data-k="docview" style="max-width:440px">${ic('doc',22)}<span class="grow"><span class="t" style="display:block">${n.attach.name}</span><span class="xs muted">PDF · ${n.attach.size} · auch unter Dokumente auffindbar</span></span></button>`:''}

    <section class="stack" aria-label="Kommentare">${n.comments.map(c=>`<div class="row" style="align-items:flex-start">${av(c.by)}<div class="cmt"><div class="small muted"><strong style="color:var(--fg)">${P(c.by).name}</strong> · ${c.time||''}</div><div>${mentionfy(c.text)}</div>${c.orig?`<div class="xs muted" style="margin-top:4px">Aus dem Polnischen übersetzt · <button class="lnk xs" data-a="orig" data-id="${n.id}" data-i="${n.comments.indexOf(c)}">${c.showOrig?'Übersetzung':'Original'} anzeigen</button></div>${c.showOrig?`<div class="small" style="margin-top:4px;font-style:italic">${esc(c.orig)}</div>`:''}`:''}</div></div>`).join('')}
      <form class="row" style="align-items:flex-start" data-f="comment" data-id="${n.id}">${`<span class="av s">${u.initials}</span>`}<label for="cm-${n.id}" class="sr">Kommentar</label><textarea class="input grow" id="cm-${n.id}" name="t" rows="2" placeholder="Kommentar schreiben … mit @ erwähnst du Kolleg:innen, z. B. @Tobias K."></textarea><button class="rbtn" type="submit" aria-label="Kommentar senden">${ic('send',18,2)}</button></form></section>
  </article>
  <aside class="col-side">${showRead ? readPanel(n) : `<section class="card"><h2 style="margin-bottom:.5rem">Gelesen</h2><div class="row">${ic('check',20,2.4)}<span>Du hast diesen Beitrag gelesen.</span></div><div class="xs muted" style="margin-top:.6rem">Wer was gelesen hat, sehen nur Autor:in und die verantwortlichen Leitungen – so ist es in der Betriebsvereinbarung vorgesehen.</div></section>`}</aside></div>`;

function readPanel(n){
  const rec = n.recipients; const read = rec.filter(r=>n.readBy[r]); const unread = rec.filter(r=>!n.readBy[r]);

  const list = S.readTab==='unread'? unread : read;
  return `<section class="card"><h2 style="margin-bottom:1rem">Lesestatus</h2>
    <div class="row" style="gap:20px">${donut(read.length, rec.length,'gelesen')}<div class="stack small" style="gap:6px"><span class="row" style="gap:8px"><span style="width:12px;height:12px;border-radius:3px;background:var(--brand)"></span>${read.length} gelesen</span><span class="row" style="gap:8px"><span style="width:12px;height:12px;border-radius:3px;background:var(--line)"></span>${unread.length} noch nicht</span><span class="xs muted">Empfänger: ${n.aud.join(', ')}</span></div></div>
    <button class="btn pri" style="width:100%;margin-top:1rem" data-a="remind" data-id="${n.id}" ${remindable?'':'disabled'}>${ic('bell',18)} ${remindable?`An ${remindable} erinnern`:'Alle erinnert'}</button>
    ${absent.length?`<div class="xs muted" style="margin-top:6px">${absent.length} Person ist abwesend und wird nicht erinnert. Automatische Erinnerung nach 48 Stunden ist aktiv (höchstens zweimal).</div>`:''}
  </section>
  <section class="card" style="padding-top:.4rem"><div class="tabs" role="tablist"><button role="tab" aria-selected="${S.readTab==='unread'}" data-a="set" data-k="readTab" data-v="unread">Noch nicht (${unread.length})</button><button role="tab" aria-selected="${S.readTab==='read'}" data-a="set" data-k="readTab" data-v="read">Gelesen (${read.length})</button></div>
    ${list.map(r=>`<div class="li" style="align-items:center">${av(r,'xs')}<span class="grow">${P(r).name}</span><span class="small muted">${n.readBy[r]? 'um '+n.readBy[r] : (P(r).absent||P(r).team)}</span></div>`).join('') || '<div class="empty small">Niemand.</div>'}</section>
  <div class="note">${ic('shield',18)}<span>Diese Übersicht sehen nur Autor:in und die Leitungen der Empfängergruppen. Lesezeiten werden nach 30 Tagen gelöscht.</span></div>`;
}

/* ---------- Suche & Assistent ---------- */
function searchIndex(){
  const idx=[];
  S.news.forEach(n=>idx.push({type:'News', title:n.title, text:n.body.join(' '), route:'news', param:n.id}));
  Object.entries(KNOW.articles).forEach(([k,a])=>idx.push({type:a.type, title:a.title, text:a.steps.map(s=>s.join(' ')).join(' ')+' '+a.path.join(' '), route:'wissen', param:k}));
  S.contacts.forEach(c=>idx.push({type:'Kontakt', title:c.name, text:c.what+' '+(c.emergency||'')+' '+c.cat, route:'kontakte', param:c.id}));
  S.docs.filter(d=>!d.secret||can('admin')).forEach(d=>idx.push({type:'Dokument', title:d.name, text:d.cat, route:'dokumente'}));
  if(can('handovers')) S.handovers.forEach(h=>idx.push({type:'Übergabe', title:h.subject, text:h.points.join(' '), route:'uebergaben', param:h.id}));
  S.checklists.forEach(c=>idx.push({type:'Checkliste', title:c.title, text:c.items.map(i=>i.title).join(' '), route:'checklisten', param:c.id}));
  return idx;
}
function doSearch(q){
  const words = q.toLowerCase().replace(/[?!.,]/g,' ').split(/\s+/).filter(w=>w.length>2 && !['was','wie','wer','ich','die','der','das','und','ist','wenn','eine','ein','mit','für','den','dem','mache','muss','kann','zu'].includes(w));
  if(!words.length) return [];
  return searchIndex().map(it=>{ const hay=(it.title+' '+it.text).toLowerCase(); const s=words.reduce((a,w)=>{ const st=w.slice(0,Math.max(4,w.length-3)); return a+(hay.includes(st)?1:0)+(it.title.toLowerCase().includes(st)?1:0); },0); return {...it,s};}).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,8);
}

  { re:/(warm|kühlkette|kuehlkette|temperatur|tiefkühl|tk-|lieferung|warenannahme)/i, a:'Nimm die Ware nicht an. Laut SOP „Kühlkette bei der Warenannahme“ dokumentierst du den gemessenen Wert in der Checkliste „Warenannahme Kühlware“ und informierst sofort die Küchenleitung [1][2]. Ist ein Kühlraum selbst betroffen, erreichst du den Kältetechnik-Notdienst rund um die Uhr [3].',

};
function aiCard(){
  const ai = S.ai;
  if(!ai) return '';
  return `<section class="ai stack" style="max-width:820px" aria-live="polite"><div class="row"><span class="badge">${ic('sparkle',20)}</span><h2 style="font-size:1.15rem">Antwort des Assistenten</h2></div>
   ${ai.loading?`<div class="thinking" aria-label="Der Assistent denkt nach"><span></span><span></span><span></span> <span class="small muted" style="animation:none;background:none;width:auto;height:auto">sucht in Inhalten, die du sehen darfst …</span></div>`
    :`<div class="fade prose">${ai.text.replace(/\[(\d)\]/g,'<sup class="chip b" style="padding:0 6px;font-size:.72rem">$1</sup>')}</div>
      ${ai.src.length?`<div class="stack fade" style="gap:8px"><div class="eyebrow">Quellen</div>${ai.src.map((s,i)=>`<button class="srcbtn" data-a="go" data-r="${s[2]}" ${s[3]?`data-p="${s[3]}"`:''}><span class="chip b">${i+1}</span><span class="grow"><span class="t" style="display:block">${s[1]}</span><span class="xs muted">${s[0]}</span></span>${ic('arrow',16)}</button>`).join('')}</div>`:''}

}
function ask(q){
  S.query=q; S.route='suche'; S.param=null;
  if(!can('ai')){ S.ai=null; render(true); return; }
  S.ai={loading:true}; render(true);
  setTimeout(()=>{
    const hit = AI.find(x=>x.re.test(q));
    if(hit) S.ai={text: typeof hit.a==='function'?hit.a():hit.a, src:hit.src};
    else { const r=doSearch(q).slice(0,3); S.ai={ text: r.length? `Eine eindeutige Antwort habe ich in den freigegebenen Inhalten nicht gefunden. Diese Einträge passen am ehesten – schau sie dir an [1]${r.length>1?'[2]':''}.<br><br><span class="small muted">Kleiner Hinweis: In der Demo kenne ich nur eine Handvoll Themen. In der echten Wirkstatt durchsuche ich alle SOPs, News und Dokumente, die du sehen darfst.</span>` : 'Dazu finde ich in den Inhalten, die du sehen darfst, nichts. Ich erfinde lieber nichts.<br><br><span class="small muted">In der Demo kenne ich nur eine Handvoll Themen – frag mich zum Beispiel nach der Kühlkette, dem Check-in oder der Dienstkleidung.</span>', src:r.map(x=>[x.type,x.title,x.route,x.param])}; }
    if(S.route==='suche') render();
  }, 1100);
}

/* ---------- Checklisten ---------- */
function itemDone(i){ if(i.type==='check') return !!i.value; if(i.value==null||i.value==='') return false; return !outOfRange(i) || !!i.note; }
function outOfRange(i){ const v=parseFloat(String(i.value).replace(',','.')); return !isNaN(v) && v>i.max; }
VIEWS.checklisten = () => {
  if(S.param){ const c=S.checklists.find(x=>x.id===S.param); if(c) return checklistRun(c); }
  return `<div class="ptitle"><h1>Checklisten</h1></div>
  <div class="stack">${S.checklists.map(c=>{ const d=c.items.filter(itemDone).length; return `<button class="card" data-a="go" data-r="checklisten" data-p="${c.id}" style="text-align:left;cursor:pointer;color:inherit;display:flex;flex-direction:column;gap:8px"><span class="row wrap" style="justify-content:space-between"><span class="row"><span class="chip ${c.kind==='HACCP'?'w':'b'}">${c.kind}</span><span class="t" style="font-size:1.1rem">${c.title}</span></span><span class="small muted">${c.team} · ${d===c.items.length?'erledigt':c.due}</span></span><span class="bar"><span style="width:${d/c.items.length*100}%"></span></span><span class="xs muted">${d} von ${c.items.length} erledigt</span></button>`;}).join('')}</div>
  <div class="note">${ic('list',18)}<span>Wiederkehrende Checklisten entstehen automatisch aus Vorlagen – z. B. jeden Morgen um 6 Uhr. HACCP-Nachweise werden zwei Jahre aufbewahrt.</span></div>`;
};
function checklistRun(c){
  const d=c.items.filter(itemDone).length; const all = d===c.items.length; const firstOpen = c.items.find(i=>!itemDone(i));
  return `<button class="lnk" data-a="go" data-r="checklisten" style="align-self:flex-start">${ic('back',16)} Alle Checklisten</button>
  <div class="stack" style="max-width:760px">
   <div><div class="chips"><span class="chip ${c.kind==='HACCP'?'w':'b'}">${c.kind}</span><span class="chip">${c.team}</span></div><h1 style="font-size:1.7rem;margin-top:.4rem">${c.title}</h1></div>
   <div class="row" style="justify-content:space-between"><span class="t">${d} von ${c.items.length} erledigt</span>${c.id==='kuehl'?`<button class="lnk" data-a="go" data-r="wissen" data-p="kuehlkette">Anleitung (SOP)</button>`:''}</div>
   <div class="bar" role="progressbar" aria-valuenow="${d}" aria-valuemin="0" aria-valuemax="${c.items.length}" aria-label="Fortschritt"><span style="width:${d/c.items.length*100}%"></span></div>
   ${c.note?`<div class="xs muted">${c.note}</div>`:''}
   ${c.items.map(i=>{ const done=itemDone(i); const bad = i.type==='temp' && i.value!=null && i.value!=='' && outOfRange(i); const cur = i===firstOpen && !bad;
     if(i.type==='check') return `<label class="citem row ${cur?'cur':''}" style="cursor:pointer"><input type="checkbox" class="sr" data-c="citem" data-cl="${c.id}" data-id="${i.id}" ${i.value?'checked':''}><span class="cstate ${done?'ok':''}">${done?ic('check',16,3):''}</span><span class="grow"><span class="t" style="display:block">${i.title}</span>${i.by?`<span class="xs muted">${i.at} · ${i.by}</span>`:''}</span></label>`;
     return `<div class="citem ${bad?'bad':cur?'cur':''}"><div class="row"><span class="cstate ${bad?'bad':done?'ok':''}">${bad?'!':done?ic('check',16,3):ic('thermo',16)}</span><div class="grow"><div class="t">${i.title}</div><div class="xs ${bad?'':'muted'}" style="${bad?'color:var(--warn-ink);font-weight:700':''}">${bad?'Über dem Sollwert – Maßnahme nötig':`Soll: höchstens ${String(i.max).replace('-','−')} °C`}${i.by?' · '+i.at+' · '+i.by:''}</div></div>${i.value!=null&&i.value!==''?`<span class="t tab" style="font-size:1.15rem;${bad?'color:var(--warn-ink)':''}">${esc(i.value)} °C</span>`:''}</div>
      ${(i.value==null||i.value==='')?`<form class="tinput" data-f="temp" data-cl="${c.id}" data-id="${i.id}"><label for="t-${i.id}" class="sr">Temperatur ${i.title} in Grad Celsius</label><input id="t-${i.id}" name="v" inputmode="decimal" placeholder="°C" autocomplete="off"><button class="btn pri">Speichern</button></form>`:''}
      ${bad?`<form class="stack" style="margin-top:.6rem;gap:8px" data-f="tnote" data-cl="${c.id}" data-id="${i.id}"><label for="n-${i.id}" class="flabel small">Was hast du getan?</label><textarea id="n-${i.id}" name="n" class="input" rows="2" placeholder="z. B. Tür war offen – geschlossen, Küchenleitung informiert, Nachmessung 07:30">${esc(i.note||'')}</textarea><div class="row wrap"><button class="btn pri sm">${i.note?'Maßnahme aktualisieren':'Maßnahme speichern'}</button><button type="button" class="btn sm" data-a="end" data-k="more">${ic('camera',16)} Foto</button><button type="button" class="btn sm" data-a="mktask" data-t="${esc(i.title)}">Aufgabe erstellen</button></div></form>`:''}
     </div>`;}).join('')}
   <button class="btn ${all?'pri':''}" style="min-height:52px" data-a="finish" data-id="${c.id}" ${all&&!c.finished?'':'disabled'}>${c.finished?`Abgeschlossen um ${c.finished} · Nachweis gespeichert`:all?'Checkliste abschließen':`Abschließen · noch ${c.items.length-d} Punkte`}</button>
  </div>`;
}

const A = {
  go:(d)=>{ if(d.r==='suche') S.query=''; go(d.r, d.p||null); },
  set:(d)=>{ S[d.k]=d.v; render(); },
  pick:(d)=>{ S.pick=d.id; S.loginStep=2; render(); setTimeout(()=>{ const el=document.getElementById('lc'); if(el) el.focus(); },30); },
  loginback:()=>{ S.loginStep=1; render(); },
  fillcode:()=>{ const el=document.getElementById('lc'); if(el){ el.value='482 913'; el.focus(); } },
  pop:(d)=>{ S.pop = S.pop===d.p? null : d.p; render(); },
  readall:()=>{ (S.notifs[me().id]||[]).forEach(n=>n.read=true); render(); },
  notif:(d)=>{ const n=(S.notifs[me().id]||[]).find(x=>x.id===d.id); if(n){ n.read=true; if(n.route==='ideen'||n.route==='verwaltung'||n.route==='social'||n.route==='aufgaben') go(n.route); else go(n.route, n.param||null);} },
  switch:()=>{ S.user=null; S.pick=null; S.loginStep=1; S.pop=null; S.demoOpen=false; render(true); },
  logout:()=>{ S.user=null; S.loginStep=1; S.pop=null; render(true); },
  end:(d)=>endDemo(d.k),
  modal:(d)=>{ S.modal={type:d.t, id:d.id}; S.pop=null; render(); setTimeout(()=>{ const f=root.querySelector('.sheet input:not([type=file]):not([type=checkbox]):not([type=radio]),.sheet textarea'); if(f) f.focus(); },30); },
  close:()=>{ S.modal=null; render(); },
  overlay:(d,el,e)=>{ if(e.target===el){ S.modal=null; render(); } },
  customize:()=>{ S.customize=!S.customize; render(); },
  newslang:(d)=>{ S.newsLang[d.id]=d.l; render(); },
  like:(d)=>{ const it=S[d.col].find(x=>x.id===d.id); it.liked=!it.liked; it.likes+=it.liked?1:-1; render(); },
  orig:(d)=>{ const c=S.news.find(n=>n.id===d.id).comments[+d.i]; c.showOrig=!c.showOrig; render(); },
  sorig:(d)=>{ const p=S.social.find(x=>x.id===d.id); p.showOrig=!p.showOrig; render(); },
  morig:(d)=>{ const m=S.chats.find(c=>c.id===d.c).msgs[+d.i]; m.showOrig=!m.showOrig; render(); },
  remind:(d)=>{ const n=S.news.find(x=>x.id===d.id); const un=n.recipients.filter(r=>!n.readBy[r]&&!P(r).absent); n.reminded=(n.reminded||0)+1; audit(`Erinnerung zu „${n.title.slice(0,40)}…“ an ${un.length} Personen gesendet`);
    toast(`Erinnerung an ${un.length} gesendet – per App, Push nach deren Zeitfenster`);
    setTimeout(()=>{ const r=un[0]; if(r && !n.readBy[r]){ n.readBy[r]=nowT(); if(S.route==='news') render(); toast(`${P(r).name} hat gerade gelesen`);} }, 2600); },
  speak:(d)=>{ const n=S.news.find(x=>x.id===d.id); const l=S.newsLang[n.id]||'de'; const T=l==='de'?n:(n[l]||n); say(T.title+'. '+T.body.join(' '), l==='en'?'en-GB':l==='pl'?'pl-PL':'de-DE'); },
  speakho:(d)=>{ const h=S.handovers.find(x=>x.id===d.id); say(h.subject+'. '+h.points.join(' ')); },
  speakk:(d)=>{ const a=KNOW.articles[d.id]; const st=S.kPlain&&a.plain?a.plain:(S.kLang==='en'&&a.en?a.en.steps:a.steps); say((S.kLang==='en'&&a.en?a.en.title:a.title)+'. '+st.map((s,i)=>(i+1)+'. '+s[0]+'. '+s[1]).join(' '), S.kLang==='en'&&a.en?'en-GB':'de-DE'); },
  ack:(d)=>{ const t=new Date(); S.ack[me().id+':'+d.id]=t.toLocaleDateString('de-DE')+' um '+nowT(); (S.notifs[me().id]||[]).forEach(n=>{ if(n.param==='kuehlkette') n.read=true; }); const n4=S.news.find(n=>n.id==='n4'); if(n4) n4.readBy[me().id]=nowT(); confetti(); toast('Danke! Kenntnisnahme für Version 3 gespeichert'); },
  ask:(d)=>ask(d.q),
  aifb:(d)=>{ S.ai.fb=d.v; render(); toast('Danke für dein Feedback – anonym gespeichert'); },
  openchat:(d)=>{ S.chatId=d.id||null; render(true); setTimeout(()=>{ const el=document.getElementById('msg'); if(el && !isM()) el.focus(); },20); },
  dm:(d)=>{ let c=S.chats.find(x=>x.type==='direct'&&x.with===d.id); if(!c){ c={id:'c'+uid(), type:'direct', with:d.id, unread:0, msgs:[{by:d.id, text:'Hallo! Was gibt’s?', t:nowT()}], replies:[{by:d.id,text:'Klingt gut, machen wir so.'},{by:d.id,text:'Danke dir!'}]}; S.chats.unshift(c);} S.chatId=c.id; S.modal=null; go('chat'); },
  marketchat:(d)=>{ const p=S.social.find(x=>x.id===d.id); let c=S.chats.find(x=>x.type==='direct'&&x.with===p.by); if(!c){ c={id:'c'+uid(), type:'direct', with:p.by, unread:0, msgs:[], replies:[{by:p.by,text:'Ja, ist noch da! Magst du es dir morgen nach dem Frühdienst anschauen?'},{by:p.by,text:'Super, dann bis morgen am Gutshof.'}]}; S.chats.unshift(c);} S.chatId=c.id; go('chat'); setTimeout(()=>{ const el=document.getElementById('msg'); if(el){ el.value=`Hallo ${P(p.by).name.split(' ')[0]}, ist das ${p.market.title.split(',')[0]} noch zu haben?`; el.focus(); } },40); },
  join:(d)=>{ const p=S.social.find(x=>x.id===d.id); p.joined=!p.joined; p.join+=p.joined?1:-1; render(); if(p.joined) toast('Du bist dabei – Dienstag, 17 Uhr am Gutshof'); },
  sold:(d)=>{ const p=S.social.find(x=>x.id===d.id); p.market.status=p.market.status==='Verfügbar'?'Erledigt':'Verfügbar'; render(); },
  delsocial:(d)=>{ S.social=S.social.filter(x=>x.id!==d.id); toast('Beitrag gelöscht'); },
  congrats:(d)=>{ S['cg'+d.id]=true; toast(`Glückwunsch an ${P(d.id).name.split(' ')[0]} gesendet`); },
  vote:(d)=>{ const i=S.ideas.find(x=>x.id===d.id); i.voted=!i.voted; i.votes+=i.voted?1:-1; render(); },
  advance:(d)=>{ const i=S.ideas.find(x=>x.id===d.id); const order=['Eingereicht','In Prüfung','Umgesetzt']; i.status=order[Math.min(order.indexOf(i.status)+1,2)]; if(i.status==='Umgesetzt') confetti(); toast(`„${i.title}“ ist jetzt: ${i.status}`); },
  copy:(d,el)=>{ const done=()=>toast(`${d.v} kopiert`); try{ navigator.clipboard.writeText(d.v).then(done,()=>toast('Nummer markiert – bitte manuell kopieren')); }catch(e){ toast('Nummer markiert – bitte manuell kopieren'); } },
  finish:(d)=>{ const c=S.checklists.find(x=>x.id===d.id); c.finished=nowT(); audit(`Checkliste „${c.title}“ abgeschlossen`); confetti(); toast('Checkliste abgeschlossen – Nachweis gespeichert'); },
  mktask:(d)=>{ S.modal={type:'newtask', prefill:`Abweichung prüfen: ${d.t}`}; render(); },
  rate:(d,el,e)=>{ e.preventDefault(); S.rate=+d.i; render(); },
  sync:(d)=>{ S.syncing=d.id; render(); setTimeout(()=>{ S.syncing=null; const i=S.integrations.find(x=>x.id===d.id); if(i) i.note='Demo-Daten · letzter Abgleich '+nowT(); audit(`${i?i.name:'Gastromatic'}-Abgleich manuell gestartet: keine Änderungen`); toast(`${i?i.name:'Gastromatic'}: Abgleich erfolgreich, keine Änderungen`); },1500); },
  doapprove:(d)=>{ const p=S.pending.find(x=>x.id===d.id); const code=String(Math.floor(100000+Math.random()*900000)).replace(/(\d{3})(\d{3})/,'$1 $2'); S.approved[d.id]={code}; audit(`${p.name} freigeschaltet, Einmal-Code persönlich übergeben, Onboarding gestartet`); render(); },
  finishapprove:(d)=>{ const p=S.pending.find(x=>x.id===d.id); S.pending=S.pending.filter(x=>x.id!==d.id); const key='new'+d.id; S.people[key]={name:p.name, ini:p.name.split(' ').map(x=>x[0]).join(''), team:p.area.split(' ')[0], job:p.area, c:'c2', isNew:true};
    S.tasks.unshift({id:uid(), owner:'lena', title:`Willkommensmappe für ${p.name} vorbereiten`, prio:'normal', due:'vor Eintritt', done:false, tag:'Onboarding '+p.name});
    S.modal=null; confetti(); toast(`${p.name} ist freigeschaltet und im Team-Verzeichnis`); },
  brand:(d)=>{ S.brand=d.v; applyBrand(); render(); toast(d.v==='sgl'?'Design: Schloss & Gut Liebenberg':'Beispiel-Design aktiv – so könnte eine weitere Gesellschaft aussehen'); },
  theme:(d)=>{ if(d.v==='system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', d.v); render(); },
  phone:()=>{ S.phone=!S.phone; S.pop=null; render(true); },
  demo:()=>{ S.demoOpen=!S.demoOpen; render(); },
  reset:()=>{ const keep={phone:S.phone, brand:'sgl'}; S=freshState(); Object.assign(S,keep); applyBrand(); render(true); toast('Demo zurückgesetzt'); },
  tour:(d)=>{ S.demoOpen=false;
    if(d.r==='ask'){ if(!can('ai')){ toast('Externe nutzen keinen KI-Assistenten – wechsle die Person'); return; } ask('Was mache ich, wenn eine TK-Lieferung zu warm ist?'); return; }
    if(d.r==='tip-maren'||d.r==='tip-lena'||d.r==='tip-design'){ const who=d.r==='tip-maren'?'maren':'lena'; if(me().id!==who){ S.user=PERSONAS[who]; toast(`Du bist jetzt ${PERSONAS[who].name}`);} if(d.r==='tip-maren') go('news','n1'); else { S.adminTab=d.r==='tip-lena'?'neu':'design'; go('verwaltung'); } return; }
    if(d.r==='chat'){ S.chatId='c2'; }
    go(d.r, d.p||null); }
};
function say(text, lang='de-DE'){
  try{ if(!('speechSynthesis' in window)) throw 0; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang=lang; u.rate=1; speechSynthesis.speak(u); toast('Wird vorgelesen …'); }
  catch(e){ endDemo('audiolang'); }
}
function confetti(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box=document.createElement('div'); box.className='confetti';
  const cols=['#6B7A3E','#B8924A','#9B7FAB','#A04050','#1E3560','#E9EDDD'];
  for(let i=0;i<46;i++){ const s=document.createElement('i'); s.style.left=Math.random()*100+'%'; s.style.background=cols[i%cols.length]; s.style.animationDelay=(Math.random()*.5)+'s'; s.style.transform=`rotate(${Math.random()*180}deg)`; box.appendChild(s); }
  document.body.appendChild(box); setTimeout(()=>box.remove(), 2600);
}

/* ---------- Formulare ---------- */
const F = {
  login:(fd)=>{ const c=String(fd.get('c')||'').replace(/\s/g,''); if(c!=='482913'){ toast('Der Code stimmt nicht. Tipp: 482 913'); const el=document.getElementById('lc'); if(el){el.value='';} return; }
    S.user=PERSONAS[S.pick]; S.route='start'; S.param=null; S.chatId=null; render(true); toast(`Willkommen in der Wirkstatt, ${S.user.name.split(' ')[0]}!`); },
  search:(fd)=>{ const q=String(fd.get('q')||'').trim(); if(!q) return; ask(q); },
  comment:(fd,f)=>{ const t=String(fd.get('t')||'').trim(); if(!t) return; const n=S.news.find(x=>x.id===f.dataset.id); n.comments.push({by:'__me', text:t, time:nowT()}); S.people.__me = {name:me().name, ini:me().initials}; document.getElementById('cm-'+n.id).value=''; render();
    const m=t.match(/@([A-ZÄÖÜ][\wäöüß]+ [A-ZÄÖÜ]\.)/); if(m) toast(`${m[1]} wird benachrichtigt`); },
  social:(fd)=>{ const t=String(fd.get('t')||'').trim(); if(!t && !S.socialPhoto) { toast('Schreib etwas oder füge ein Foto hinzu'); return; } S.social.unshift({id:uid(), by:me().id, cat:fd.get('cat'), vis:fd.get('vis'), time:'gerade eben', text:t, photo:S.socialPhoto||null, likes:0, liked:false, comments:[]}); S.socialPhoto=null; document.getElementById('sp').value=''; S.socialFilter='Alle'; toast('Geteilt mit '+fd.get('vis')); },
  scomment:(fd,f)=>{ const t=String(fd.get('t')||'').trim(); if(!t) return; S.social.find(x=>x.id===f.dataset.id).comments.push({by:'me', text:t}); document.getElementById('sc-'+f.dataset.id).value=''; render(); },
  hcomment:(fd,f)=>{ const t=String(fd.get('t')||'').trim(); if(!t) return; S.handovers.find(x=>x.id===f.dataset.id).comments.push({by:'me', text:t, time:nowT()}); document.getElementById('hc').value=''; render(); },
  chat:(fd,f)=>{ const t=String(fd.get('t')||'').trim(); if(!t) return; const c=S.chats.find(x=>x.id===f.dataset.id); c.msgs.push({by:'me', text:t, t:nowT(), status:'sent'}); document.getElementById('msg').value=''; render();
    setTimeout(()=>{ S.typing=c.id; if(S.route==='chat') render(); }, 700);
    setTimeout(()=>{ const r=c.replies[(c.ri=(c.ri||0))%c.replies.length]; c.ri++; c.msgs.forEach(x=>{ if(x.by==='me') x.status='read'; }); c.msgs.push({by:r.by, text:r.text, orig:r.orig, t:nowT()}); S.typing=null; if(S.route==='chat' && S.chatId===c.id) render(); else { c.unread=(c.unread||0)+1; toast(`Neue Nachricht von ${P(r.by).name}`); } }, 2300); },
  temp:(fd,f)=>{ const v=String(fd.get('v')||'').trim(); if(!v || isNaN(parseFloat(v.replace(',','.')))) { toast('Bitte eine Zahl eingeben, z. B. 4,5'); return; } const c=S.checklists.find(x=>x.id===f.dataset.cl); const i=c.items.find(x=>x.id===f.dataset.id); i.value=v.replace('.',','); i.by=me().name; i.at=nowT(); render(); if(outOfRange(i)) toast('Wert über dem Sollwert – bitte Maßnahme eintragen'); },
  tnote:(fd,f)=>{ const n=String(fd.get('n')||'').trim(); if(!n){ toast('Bitte kurz beschreiben, was du getan hast'); return; } const c=S.checklists.find(x=>x.id===f.dataset.cl); c.items.find(x=>x.id===f.dataset.id).note=n; render(); toast('Maßnahme dokumentiert'); },
  survey:(fd)=>{ const s=S.survey; s.q1.counts[S.rate??3]++; fd.getAll('q2').forEach(i=>s.q2.counts[+i]++); const t=String(fd.get('q3')||'').trim(); if(t) s.q3.texts.splice(Math.floor(Math.random()*(s.q3.texts.length+1)),0,t); s.answered=true; render(); toast('Danke! Deine Antwort ist anonym gespeichert'); },
  newpost:(fd)=>{ const n={id:'n'+uid(), author:'__me', team:me().team, time:'gerade eben', title:fd.get('title'), body:String(fd.get('body')).split(/\n+/), important:!!fd.get('imp'), aud:[fd.get('aud')], likes:0, liked:false, comments:[], recipients:['jana','selin','jonas','piotr','tobias'].filter(x=>x!==me().id), readBy:{}, track:!!fd.get('track'), uploaded:S.postPhoto||null};
    S.people.__me={name:me().name, ini:me().initials, job:me().role}; n.author='__me'; S.news.unshift(n); S.postPhoto=null; S.modal=null; S.newsTab='all'; go('news', n.id); toast('Veröffentlicht'); if(n.track) setTimeout(()=>{ n.readBy.selin=nowT(); if(S.route==='news') render(); },3000); },
  newhandover:(fd)=>{ const h={id:'h'+uid(), team:fd.get('team'), shift:fd.get('shift'), by:me().id, time:'gerade eben', subject:fd.get('subject'), points:String(fd.get('points')).split(/\n+/).filter(Boolean), photos:0, img:S.hoPhoto||null, readBy:{}, comments:[]};
    S.people[me().id] ||= {name:me().name, ini:me().initials}; S.handovers.unshift(h); S.hoPhoto=null; S.modal=null; S.handTeam=h.team; go('uebergaben', h.id); toast('Übergabe gesendet – das Team wird benachrichtigt'); setTimeout(()=>{ h.readBy.jonas=nowT(); if(S.route==='uebergaben') render(); },3500); },
  newtask:(fd)=>{ S.tasks.unshift({id:uid(), owner:me().id, title:fd.get('title'), prio:fd.get('prio'), due:fd.get('due'), done:false}); S.modal=null; S.taskTab='offen'; render(); toast('Aufgabe angelegt'); },
  newidea:(fd)=>{ S.ideas.unshift({id:uid(), title:fd.get('title'), text:fd.get('text')||'', cat:fd.get('cat'), status:'Eingereicht', votes:1, voted:true, by:me().name}); S.modal=null; render(); toast('Danke! Deine Idee ist eingereicht'); }
};

/* ---------- Änderungen (Checkboxen, Selects, Dateien) ---------- */
const C = {
  widget:(el)=>{ S.widgets[el.dataset.k]=el.checked; render(); },
  task:(el)=>{ const t=S.tasks.find(x=>x.id===el.dataset.id); t.done=el.checked; render(); if(t.done) toast('Erledigt!'); },
  citem:(el)=>{ const c=S.checklists.find(x=>x.id===el.dataset.cl); const i=c.items.find(x=>x.id===el.dataset.id); i.value=el.checked; i.by=el.checked?me().name:null; i.at=nowT(); render(); },
  klang:(el)=>{ S.kLang=el.value; render(); },
  kplain:(el)=>{ S.kPlain=el.checked; render(); },
  cq:(el)=>{ S.contactQ=el.value; render(); },
  emerg:(el)=>{ S.emergencyOnly=el.checked; render(); },
  fs:(el)=>{ S.fs=+el.value; applyVars(); const v=document.getElementById('fsv'); if(v) v.textContent=Math.round(S.fs/16*100)+' %'; },
  np:(el)=>{ S.notifPrefs[+el.dataset.i][el.dataset.k]=el.checked; toast('Gespeichert'); },
  nw:(el)=>{ S.notifPrefs[+el.dataset.i].win=el.value; toast('Zeitfenster gespeichert'); },
  navm:(el)=>{ const r=el.dataset.r; if(el.checked){ if(S.navMobile.length>=4){ el.checked=false; toast('Höchstens vier Bereiche – nimm erst einen raus'); return; } S.navMobile.push(r);} else S.navMobile=S.navMobile.filter(x=>x!==r); render(); },
  socialphoto:(el)=>readImg(el, d=>{ S.socialPhoto=d; render(); }),
  postphoto:(el)=>readImg(el, d=>{ S.postPhoto=d; render(); }),
  hophoto:(el)=>readImg(el, d=>{ S.hoPhoto=d; render(); }),
  upload:(el)=>{ const f=el.files&&el.files[0]; if(!f) return; S.docs.unshift({id:uid(), name:f.name, cat:'Meine Uploads', ver:'1', date:'heute', size:Math.max(1,Math.round(f.size/1024))+' KB', isNew:true}); S.docsFilter='Alle'; render(); toast(`${f.name} hochgeladen – wird auf Viren geprüft`); }
};
function readImg(el, cb){ const f=el.files&&el.files[0]; if(!f) return; if(f.size>8e6){ toast('Das Foto ist größer als 8 MB'); return; } const r=new FileReader(); r.onload=()=>cb(r.result); r.readAsDataURL(f); }

root.addEventListener('click', e=>{ const t=e.target.closest('[data-a]'); if(!t || !root.contains(t)) { if(S.pop && !e.target.closest('.popwrap')){ S.pop=null; render(); } return; }
  const a=t.dataset.a; if(A[a]){ if(t.tagName==='A') e.preventDefault(); A[a](t.dataset, t, e); } });
root.addEventListener('submit', e=>{ const f=e.target.closest('form[data-f]'); if(!f) return; e.preventDefault(); F[f.dataset.f] && F[f.dataset.f](new FormData(f), f); });
root.addEventListener('change', e=>{ const el=e.target.closest('[data-c]'); if(el && C[el.dataset.c] && el.dataset.c!=='cq' && el.dataset.c!=='fs') C[el.dataset.c](el); });
root.addEventListener('input', e=>{ const el=e.target.closest('[data-c="cq"],[data-c="fs"]'); if(el) C[el.dataset.c](el); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ if(S.modal){ S.modal=null; render(); } else if(S.pop){ S.pop=null; render(); } else if(S.demoOpen){ S.demoOpen=false; render(); } } });
let rz; window.addEventListener('resize', ()=>{ clearTimeout(rz); rz=setTimeout(()=>render(), 150); });

function applyBrand(){ const c={sgl:'#6B7A3E', teal:'#00706E', blau:'#1E3560'}[S.brand]; document.documentElement.style.setProperty('--brand', c); }
function applyVars(){ document.documentElement.style.setProperty('--fs', S.fs+'px'); }
applyBrand(); applyVars(); render();
</script></body></html>
