# Codespaces / Dev Container: App-Container + PostgreSQL 16
services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:1-22-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    # App teilt das Netzwerk mit der Datenbank → erreichbar unter localhost:5432
    network_mode: service:db
    environment:
      DATABASE_URL: postgresql://wir:wir@localhost:5432/wir
      APP_SECRET: nur-fuer-entwicklung-bitte-aendern
      API_URL: http://localhost:3001
      DEFAULT_COMPANY: SGL

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: wir
      POSTGRES_PASSWORD: wir
      POSTGRES_DB: wir
    volumes:
      - wir-db:/var/lib/postgresql/data

volumes:
  wir-db:
